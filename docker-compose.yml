services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-duma_user}:${POSTGRES_PASSWORD:-duma_password}@db:5432/${POSTGRES_DB:-duma}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-duma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duma_password}
      POSTGRES_DB: ${POSTGRES_DB:-duma}
    volumes:
      - duma_pgdata:/var/lib/postgresql/data

volumes:
  duma_pgdata:
