<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Городская Дума — реестр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5F0;
    --paper-dim: #EFEBE2;
    --ink: #1C1B18;
    --ink-soft: #5B5749;
    --rule: #D9D4C7;
    --navy: #16283F;
    --navy-soft: #1F3A5C;
    --brass: #B08D57;
    --danger: #A23B2E;
    --danger-bg: #F5E7E4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "PT Sans", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  h1, h2, h3, .num {
    font-family: "PT Serif", serif;
    font-weight: 700;
    margin: 0;
  }
  a { color: inherit; }

  .layout { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 240px; flex-shrink: 0;
    background: var(--navy);
    color: #E9E4D8;
    padding: 28px 0;
    display: flex; flex-direction: column;
  }
  .brand {
    padding: 0 24px 22px 24px;
    border-bottom: 1px solid rgba(233,228,216,0.18);
    margin-bottom: 10px;
  }
  .brand .crest {
    font-family: "PT Serif", serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--brass);
    margin-bottom: 4px;
  }
  .brand .title {
    font-family: "PT Serif", serif;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.25;
  }
  nav.sections { flex: 1; padding-top: 8px; }
  nav.sections a {
    display: block;
    padding: 11px 24px;
    text-decoration: none;
    color: #C9C2AF;
    border-left: 3px solid transparent;
    font-size: 14.5px;
  }
  nav.sections a:hover { color: #F2EEE3; background: rgba(255,255,255,0.04); }
  nav.sections a.active {
    color: #fff;
    border-left-color: var(--brass);
    background: rgba(255,255,255,0.06);
  }
  .sidebar-foot {
    padding: 16px 24px 0 24px;
    font-size: 12px;
    color: #7C7869;
    border-top: 1px solid rgba(233,228,216,0.12);
  }

  /* ---------- Main ---------- */
  main { flex: 1; padding: 40px 48px; max-width: 980px; }
  .page-head { margin-bottom: 28px; }
  .page-head h1 { font-size: 26px; }
  .page-head .sub { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }

  /* Registry-style stats (no card-kit shadows, hairline rules instead) */
  .register {
    border-top: 1px solid var(--ink);
  }
  .register-row {
    display: flex; align-items: baseline;
    padding: 20px 4px;
    border-bottom: 1px solid var(--rule);
    text-decoration: none; color: inherit;
  }
  .register-row:hover { background: var(--paper-dim); }
  .register-row .num { font-size: 34px; width: 90px; color: var(--navy-soft); }
  .register-row .label { font-size: 16px; }
  .register-row .arrow { margin-left: auto; color: var(--ink-soft); font-size: 14px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th {
    text-align: left; font-family: "PT Sans", sans-serif; font-weight: 700;
    font-size: 12.5px; color: var(--ink-soft);
    border-bottom: 1px solid var(--ink);
    padding: 8px 10px;
  }
  td { padding: 10px 10px; border-bottom: 1px solid var(--rule); font-size: 14.5px; vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--paper-dim); }
  .muted { color: var(--ink-soft); }
  .tag {
    display: inline-block; font-size: 12px; padding: 2px 8px;
    border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-soft);
  }
  .tag.chair { border-color: var(--brass); color: #7A5F35; background: #FBF3E6; }
  .tag.held { border-color: #3E6B47; color: #3E6B47; background: #EAF2EB; }
  .tag.cancelled { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
  .tag.scheduled { border-color: var(--navy-soft); color: var(--navy-soft); background: #E9EEF3; }

  /* Forms */
  .panel {
    border: 1px solid var(--rule);
    padding: 18px 20px;
    margin-top: 22px;
    background: #FCFBF8;
  }
  .panel h3 { font-size: 15px; margin-bottom: 14px; }
  .field-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--ink-soft); }
  .field input, .field select {
    font-family: "PT Sans", sans-serif; font-size: 14px;
    padding: 7px 9px; border: 1px solid var(--rule); background: #fff; color: var(--ink);
    min-width: 160px;
  }
  .field input:focus, .field select:focus, button:focus {
    outline: 2px solid var(--navy-soft); outline-offset: 1px;
  }
  button {
    font-family: "PT Sans", sans-serif; font-weight: 700; font-size: 13.5px;
    padding: 8px 16px; border: 1px solid var(--navy);
    background: var(--navy); color: #fff; cursor: pointer;
  }
  button:hover { background: var(--navy-soft); }
  button.secondary { background: #fff; color: var(--navy); }
  button.secondary:hover { background: var(--paper-dim); }
  button.danger { background: #fff; border-color: var(--danger); color: var(--danger); }
  button.danger:hover { background: var(--danger-bg); }

  .banner {
    padding: 12px 16px; margin-bottom: 18px; font-size: 14px;
    border-left: 3px solid var(--danger); background: var(--danger-bg); color: var(--danger);
  }
  .banner.ok { border-left-color: #3E6B47; background: #EAF2EB; color: #2E4E35; }

  .back-link { font-size: 13.5px; color: var(--navy-soft); text-decoration: none; display: inline-block; margin-bottom: 14px; }
  .back-link:hover { text-decoration: underline; }
  .empty { color: var(--ink-soft); font-size: 14px; padding: 16px 0; }
  .section-title { font-size: 15px; margin: 26px 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid var(--ink); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="crest">РЕЕСТР · ЛР1</div>
      <div class="title">Городская&nbsp;Дума</div>
    </div>
    <nav class="sections" id="nav">
      <a href="#/" data-key="">Главная</a>
      <a href="#/deputies" data-key="deputies">Депутаты</a>
      <a href="#/commissions" data-key="commissions">Комиссии</a>
      <a href="#/attendance" data-key="attendance">Посещаемость</a>
    </nav>
    <div class="sidebar-foot">API: <span id="api-status">…</span></div>
  </aside>
  <main id="app"></main>
</div>

<script>
const app = document.getElementById('app');
const navLinks = document.querySelectorAll('#nav a');

async function api(path, options) {
  const res = await fetch(path, options);
  let body = null;
  try { body = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const message = (body && body.detail) ? body.detail : `Ошибка ${res.status}`;
    throw new Error(message);
  }
  return body;
}

function banner(message, ok) {
  return `<div class="banner${ok ? ' ok' : ''}">${message}</div>`;
}

function setActiveNav(key) {
  navLinks.forEach(a => a.classList.toggle('active', a.dataset.key === key));
}

function statusTag(status) {
  const labels = { scheduled: 'запланировано', held: 'проведено', cancelled: 'отменено' };
  return `<span class="tag ${status}">${labels[status] || status}</span>`;
}

async function checkHealth() {
  const el = document.getElementById('api-status');
  try {
    const h = await api('/health');
    el.textContent = h.status === 'ok' ? 'на связи' : 'проблема с БД';
  } catch (e) {
    el.textContent = 'недоступен';
  }
}

// ---------- Главная ----------
async function renderHome() {
  setActiveNav('');
  app.innerHTML = `<div class="page-head"><h1>Главная</h1><div class="sub">Сводка по реестру на текущий момент</div></div><div id="stats" class="register"></div>`;
  const stats = document.getElementById('stats');
  try {
    const [deputies, commissions, meetings] = await Promise.all([
      api('/deputies'), api('/commissions'), api('/meetings')
    ]);
    stats.innerHTML = `
      <a class="register-row" href="#/deputies"><span class="num">${deputies.length}</span><span class="label">Депутаты</span><span class="arrow">→</span></a>
      <a class="register-row" href="#/commissions"><span class="num">${commissions.length}</span><span class="label">Комиссии</span><span class="arrow">→</span></a>
      <a class="register-row" href="#/attendance"><span class="num">${meetings.length}</span><span class="label">Заседания</span><span class="arrow">→</span></a>
    `;
  } catch (e) {
    stats.innerHTML = banner('Не удалось загрузить сводку: ' + e.message);
  }
}

// ---------- Депутаты ----------
async function renderDeputies() {
  setActiveNav('deputies');
  app.innerHTML = `
    <div class="page-head"><h1>Депутаты</h1><div class="sub">Полный список депутатов городской думы</div></div>
    <div id="msg"></div>
    <table>
      <thead><tr><th>№</th><th>ФИО</th><th>Партия</th><th>Округ</th><th>Статус</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">Загрузка…</td></tr></tbody>
    </table>
    <div class="panel">
      <h3>Добавить депутата</h3>
      <form id="add-form">
        <div class="field-row">
          <div class="field"><label>ФИО *</label><input name="full_name" required minlength="2"></div>
          <div class="field"><label>Партия</label><input name="party"></div>
          <div class="field"><label>Округ</label><input name="election_district"></div>
          <button type="submit">Добавить</button>
        </div>
      </form>
    </div>
  `;
  const msg = document.getElementById('msg');
  const rows = document.getElementById('rows');

  async function load() {
    try {
      const list = await api('/deputies');
      rows.innerHTML = list.length ? list.map(d => `
        <tr>
          <td>${d.id}</td>
          <td>${d.full_name}</td>
          <td class="muted">${d.party || '—'}</td>
          <td class="muted">${d.election_district || '—'}</td>
          <td>${d.is_active ? '<span class="tag scheduled">действующий</span>' : '<span class="tag cancelled">неактивен</span>'}</td>
          <td><button class="secondary" data-stats="${d.id}">Посещаемость</button></td>
        </tr>
        <tr id="stats-${d.id}" style="display:none"><td colspan="6" class="muted" id="stats-body-${d.id}"></td></tr>
      `).join('') : `<tr><td colspan="6" class="empty">Пока нет ни одного депутата — добавьте первого ниже.</td></tr>`;

      rows.querySelectorAll('[data-stats]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.stats;
          const row = document.getElementById(`stats-${id}`);
          const body = document.getElementById(`stats-body-${id}`);
          if (row.style.display === 'none') {
            const s = await api(`/deputies/${id}/attendance-stats`);
            body.textContent = `Всего заседаний: ${s.total_meetings} · присутствовал: ${s.present} · отсутствовал: ${s.absent} · по уважительной причине: ${s.excused}` +
              (s.attendance_rate !== null ? ` · посещаемость: ${Math.round(s.attendance_rate*100)}%` : '');
            row.style.display = '';
          } else {
            row.style.display = 'none';
          }
        });
      });
    } catch (e) {
      rows.innerHTML = `<tr><td colspan="6">${banner('Не удалось загрузить список: ' + e.message)}</td></tr>`;
    }
  }

  document.getElementById('add-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const payload = { full_name: fd.get('full_name') };
    if (fd.get('party')) payload.party = fd.get('party');
    if (fd.get('election_district')) payload.election_district = fd.get('election_district');
    try {
      await api('/deputies', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      msg.innerHTML = '';
      ev.target.reset();
      load();
    } catch (e) {
      msg.innerHTML = banner('Не удалось добавить: ' + e.message);
    }
  });

  load();
}

// ---------- Комиссии (список) ----------
async function renderCommissions() {
  setActiveNav('commissions');
  app.innerHTML = `
    <div class="page-head"><h1>Комиссии</h1><div class="sub">Состав, председатели и заседания — по клику на комиссию</div></div>
    <div id="msg"></div>
    <table>
      <thead><tr><th>№</th><th>Название</th><th>Описание</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="empty">Загрузка…</td></tr></tbody>
    </table>
    <div class="panel">
      <h3>Создать комиссию</h3>
      <form id="add-form">
        <div class="field-row">
          <div class="field"><label>Название *</label><input name="name" required minlength="2"></div>
          <div class="field"><label>Описание</label><input name="description"></div>
          <button type="submit">Создать</button>
        </div>
      </form>
    </div>
  `;
  const msg = document.getElementById('msg');
  const rows = document.getElementById('rows');

  async function load() {
    try {
      const list = await api('/commissions');
      rows.innerHTML = list.length ? list.map(c => `
        <tr class="clickable" data-open="${c.id}">
          <td>${c.id}</td><td>${c.name}</td><td class="muted">${c.description || '—'}</td>
        </tr>
      `).join('') : `<tr><td colspan="3" class="empty">Пока нет ни одной комиссии — создайте первую ниже.</td></tr>`;
      rows.querySelectorAll('[data-open]').forEach(tr => {
        tr.addEventListener('click', () => { location.hash = `#/commissions/${tr.dataset.open}`; });
      });
    } catch (e) {
      rows.innerHTML = `<tr><td colspan="3">${banner('Не удалось загрузить список: ' + e.message)}</td></tr>`;
    }
  }

  document.getElementById('add-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const payload = { name: fd.get('name') };
    if (fd.get('description')) payload.description = fd.get('description');
    try {
      await api('/commissions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      msg.innerHTML = '';
      ev.target.reset();
      load();
    } catch (e) {
      msg.innerHTML = banner('Не удалось создать: ' + e.message);
    }
  });

  load();
}

// ---------- Комиссия: детали (состав + заседания) ----------
async function renderCommissionDetail(id) {
  setActiveNav('commissions');
  app.innerHTML = `<a class="back-link" href="#/commissions">← Все комиссии</a><div id="body">Загрузка…</div>`;
  const body = document.getElementById('body');

  async function load() {
    try {
      const [commission, members, meetings, deputies] = await Promise.all([
        api(`/commissions/${id}`), api(`/commissions/${id}/members`),
        api(`/meetings?commission_id=${id}`), api('/deputies')
      ]);
      const deputyName = (depId) => (deputies.find(d => d.id === depId) || {}).full_name || `#${depId}`;

      body.innerHTML = `
        <div class="page-head"><h1>${commission.name}</h1><div class="sub">${commission.description || 'Без описания'}</div></div>
        <div id="msg"></div>

        <div class="section-title">Состав комиссии</div>
        <table>
          <thead><tr><th>Депутат</th><th>Роль</th><th>Дата вступления</th></tr></thead>
          <tbody>
            ${members.length ? members.map(m => `
              <tr><td>${deputyName(m.deputy_id)}</td>
                  <td>${m.is_chair ? '<span class="tag chair">председатель</span>' : '<span class="muted">член комиссии</span>'}</td>
                  <td class="muted">${m.joined_at}</td></tr>
            `).join('') : `<tr><td colspan="3" class="empty">Ещё никто не включён в состав.</td></tr>`}
          </tbody>
        </table>
        <div class="panel">
          <h3>Добавить в состав</h3>
          <form id="member-form">
            <div class="field-row">
              <div class="field"><label>Депутат *</label>
                <select name="deputy_id" required>
                  <option value="">— выбрать —</option>
                  ${deputies.map(d => `<option value="${d.id}">${d.full_name}</option>`).join('')}
                </select>
              </div>
              <div class="field"><label><input type="checkbox" name="is_chair"> назначить председателем</label></div>
              <button type="submit">Добавить</button>
            </div>
          </form>
        </div>

        <div class="section-title">Заседания</div>
        <table>
          <thead><tr><th>Название</th><th>Дата</th><th>Статус</th><th></th></tr></thead>
          <tbody id="meetings-rows">
            ${meetings.length ? meetings.map(m => `
              <tr>
                <td>${m.title}</td>
                <td class="muted">${new Date(m.scheduled_at).toLocaleString('ru-RU')}</td>
                <td>${statusTag(m.status)}</td>
                <td>${m.status === 'scheduled' ? `<button class="secondary" data-hold="${m.id}">Провести</button>` : ''}</td>
              </tr>
            `).join('') : `<tr><td colspan="4" class="empty">Заседаний пока не назначено.</td></tr>`}
          </tbody>
        </table>
        <div class="panel">
          <h3>Назначить заседание</h3>
          <form id="meeting-form">
            <div class="field-row">
              <div class="field"><label>Название *</label><input name="title" required minlength="2"></div>
              <div class="field"><label>Дата и время *</label><input type="datetime-local" name="scheduled_at" required></div>
              <button type="submit">Назначить</button>
            </div>
          </form>
        </div>
      `;

      const msg = document.getElementById('msg');

      document.getElementById('member-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        try {
          await api(`/commissions/${id}/members`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ deputy_id: Number(fd.get('deputy_id')), is_chair: fd.get('is_chair') === 'on' })
          });
          msg.innerHTML = ''; load();
        } catch (e) { msg.innerHTML = banner('Не удалось добавить в состав: ' + e.message); }
      });

      document.getElementById('meeting-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        try {
          await api('/meetings', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ commission_id: Number(id), title: fd.get('title'), scheduled_at: fd.get('scheduled_at') })
          });
          msg.innerHTML = ''; load();
        } catch (e) { msg.innerHTML = banner('Не удалось назначить заседание: ' + e.message); }
      });

      document.querySelectorAll('[data-hold]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await api(`/meetings/${btn.dataset.hold}/status`, {
              method: 'PATCH', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ status: 'held' })
            });
            msg.innerHTML = banner('Заседание отмечено как проведённое.', true);
            load();
          } catch (e) { msg.innerHTML = banner(e.message); }
        });
      });

    } catch (e) {
      body.innerHTML = banner('Не удалось загрузить комиссию: ' + e.message);
    }
  }

  load();
}

// ---------- Посещаемость (по заседаниям) ----------
async function renderAttendance() {
  setActiveNav('attendance');
  app.innerHTML = `
    <div class="page-head"><h1>Посещаемость</h1><div class="sub">Отметки по каждому заседанию</div></div>
    <div id="msg"></div>
    <div class="field-row">
      <div class="field"><label>Заседание</label><select id="meeting-select"><option>Загрузка…</option></select></div>
    </div>
    <div id="detail"></div>
  `;
  const select = document.getElementById('meeting-select');
  const detail = document.getElementById('detail');
  const msg = document.getElementById('msg');

  let meetings = [];
  try {
    meetings = await api('/meetings');
  } catch (e) {
    msg.innerHTML = banner('Не удалось загрузить заседания: ' + e.message);
    return;
  }
  if (!meetings.length) {
    select.innerHTML = '<option>Заседаний ещё нет</option>';
    detail.innerHTML = `<div class="empty">Сначала назначьте заседание в разделе «Комиссии».</div>`;
    return;
  }
  select.innerHTML = meetings.map(m => `<option value="${m.id}">${m.title} — ${new Date(m.scheduled_at).toLocaleDateString('ru-RU')}</option>`).join('');

  async function loadDetail(meetingId) {
    try {
      const [attendance, deputies] = await Promise.all([
        api(`/meetings/${meetingId}/attendance`), api('/deputies')
      ]);
      const deputyName = (id) => (deputies.find(d => d.id === id) || {}).full_name || `#${id}`;
      const labels = { present: 'присутствовал', absent: 'отсутствовал', excused: 'по уважительной причине' };
      detail.innerHTML = `
        <table>
          <thead><tr><th>Депутат</th><th>Статус</th><th>Примечание</th></tr></thead>
          <tbody>
            ${attendance.length ? attendance.map(a => `
              <tr><td>${deputyName(a.deputy_id)}</td><td>${labels[a.status]}</td><td class="muted">${a.note || '—'}</td></tr>
            `).join('') : `<tr><td colspan="3" class="empty">Отметок пока нет.</td></tr>`}
          </tbody>
        </table>
        <div class="panel">
          <h3>Отметить посещаемость</h3>
          <form id="mark-form">
            <div class="field-row">
              <div class="field"><label>Депутат *</label>
                <select name="deputy_id" required>
                  <option value="">— выбрать —</option>
                  ${deputies.map(d => `<option value="${d.id}">${d.full_name}</option>`).join('')}
                </select>
              </div>
              <div class="field"><label>Статус *</label>
                <select name="status" required>
                  <option value="present">присутствовал</option>
                  <option value="absent">отсутствовал</option>
                  <option value="excused">по уважительной причине</option>
                </select>
              </div>
              <div class="field"><label>Примечание</label><input name="note"></div>
              <button type="submit">Отметить</button>
            </div>
          </form>
        </div>
      `;
      document.getElementById('mark-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const payload = { deputy_id: Number(fd.get('deputy_id')), status: fd.get('status') };
        if (fd.get('note')) payload.note = fd.get('note');
        try {
          await api(`/meetings/${meetingId}/attendance`, {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
          });
          msg.innerHTML = ''; loadDetail(meetingId);
        } catch (e) { msg.innerHTML = banner('Не удалось отметить: ' + e.message); }
      });
    } catch (e) {
      detail.innerHTML = banner('Не удалось загрузить посещаемость: ' + e.message);
    }
  }

  select.addEventListener('change', () => loadDetail(select.value));
  loadDetail(select.value);
}

// ---------- Router ----------
function route() {
  const hash = location.hash || '#/';
  const commissionMatch = hash.match(/^#\/commissions\/(\d+)$/);
  if (hash === '#/' || hash === '') renderHome();
  else if (hash === '#/deputies') renderDeputies();
  else if (hash === '#/commissions') renderCommissions();
  else if (commissionMatch) renderCommissionDetail(commissionMatch[1]);
  else if (hash === '#/attendance') renderAttendance();
  else renderHome();
}

window.addEventListener('hashchange', route);
checkHealth();
route();
</script>
</body>
</html>
