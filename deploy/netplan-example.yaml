# Пример для app-server (192.168.56.10). На db-server — та же схема,
# только адрес 192.168.56.11 и, при желании, другое имя интерфейса.
#
# Узнать имя host-only интерфейса: `ip link show` (обычно enp0s8 или похоже).
# Файл кладётся в /etc/netplan/01-hostonly.yaml на самой VM (это не выполняется
# автоматически — правьте вручную под реальное имя интерфейса вашей машины).

network:
  version: 2
  ethernets:
    enp0s8:                # <-- замените на реальное имя интерфейса (ip link show)
      addresses:
        - 192.168.56.10/24  # .10 для app-server, .11 для db-server
      # адрес шлюза/DNS не нужен на этом интерфейсе — за интернет отвечает NAT-адаптер (enp0s3)
